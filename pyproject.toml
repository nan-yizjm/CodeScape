[project]
name = "codescape"
version = "0.1.1"
description = "Local source-code learning workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "tree-sitter==0.25.2",
  "tree-sitter-c>=0.23,<0.25",
  "tree-sitter-cpp>=0.23,<0.25",
  "libclang>=18,<19",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
packaging = [
    "pyinstaller==6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/codescape"]

[tool.pytest.ini_options]
pythonpath = ["server", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
