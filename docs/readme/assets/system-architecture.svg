<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="870" viewBox="0 0 1120 870" role="img" aria-labelledby="title description">
<title id="title">CodeScape 系统架构</title>
<desc id="description">本地工作区与外部模型之间的职责、进程和数据边界。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#64748b"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<rect width="1120" height="870" rx="24" fill="#f8fafc"/>
<text x="40" y="53" font-size="30" font-weight="700" fill="#142033">CodeScape 系统架构</text><text x="40" y="87" font-size="17" font-weight="400" fill="#46566d">本地工作区与外部模型之间的职责、进程和数据边界。</text><rect x="24" y="120" width="812" height="650" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="7 6"/><rect x="860" y="120" width="236" height="650" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="7 6"/><text x="44" y="148" font-size="15" font-weight="650" fill="#46566d">本机 · Windows 用户工作区</text><text x="882" y="151" font-size="16" font-weight="650" fill="#46566d">外部接收端</text><text x="882" y="230" font-size="18" font-weight="650" fill="#142033">仅授权后发送</text><text x="882" y="260" font-size="17" font-weight="400" fill="#46566d">范围内源码与上下文</text><rect x="64" y="170" width="732" height="92" rx="18" fill="#eef3ff" stroke="#cbd5e1"/><text x="88" y="208" font-size="23" font-weight="650" fill="#142033">浏览器工作区 · React</text><text x="88" y="240" font-size="18" font-weight="400" fill="#46566d">架构探索 / 只读源码 / 搜索笔记 / 双项目学习</text><rect x="64" y="304" width="732" height="94" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="88" y="342" font-size="23" font-weight="650" fill="#142033">本地服务 · FastAPI</text><text x="88" y="374" font-size="18" font-weight="400" fill="#46566d">会话与 CSRF / 导入与任务 / 版本与修订 / 数据访问</text><rect x="64" y="454" width="346" height="118" rx="18" fill="#edf8f4" stroke="#cbd5e1"/><text x="88" y="492" font-size="23" font-weight="650" fill="#142033">解析工作进程</text><text x="88" y="524" font-size="18" font-weight="400" fill="#46566d">Python AST / TypeScript</text><text x="88" y="551" font-size="18" font-weight="400" fill="#46566d">Tree-sitter / libclang</text><rect x="450" y="454" width="346" height="118" rx="18" fill="#f3efff" stroke="#cbd5e1"/><text x="474" y="492" font-size="23" font-weight="650" fill="#142033">AI 工作进程</text><text x="474" y="524" font-size="18" font-weight="400" fill="#46566d">分批 / 补读 / 校验</text><text x="474" y="551" font-size="18" font-weight="400" fill="#46566d">请求与用量 / 检查点</text><rect x="882" y="454" width="192" height="118" rx="18" fill="#fff5e8" stroke="#cbd5e1"/><text x="906" y="492" font-size="23" font-weight="650" fill="#142033">模型服务</text><text x="906" y="524" font-size="18" font-weight="400" fill="#46566d">DeepSeek</text><text x="906" y="551" font-size="18" font-weight="400" fill="#46566d">或兼容接口</text><rect x="64" y="618" width="732" height="128" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="84" y="645" font-size="16" font-weight="650" fill="#46566d">本地持久化 · 数据与程序安装目录分离</text><rect x="84" y="662" width="200" height="65" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="100" y="688" font-size="18" font-weight="650" fill="#142033">SQLite</text><text x="100" y="712" font-size="15" font-weight="400" fill="#46566d">项目 / 任务 / 工作区</text><rect x="304" y="662" width="246" height="65" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="320" y="688" font-size="18" font-weight="650" fill="#142033">快照与检查点</text><text x="320" y="712" font-size="15" font-weight="400" fill="#46566d">带版本的只读源码</text><rect x="570" y="662" width="206" height="65" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="586" y="688" font-size="18" font-weight="650" fill="#142033">DPAPI 凭据</text><text x="586" y="712" font-size="15" font-weight="400" fill="#46566d">当前 Windows 用户</text><path d="M 430 262 V 304" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="446" y="291" font-size="14" font-weight="400" fill="#46566d">同源 HTTP</text><path d="M 430 398 V 426 H 237 V 454" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 430 426 H 623 V 454" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 64 350 H 44 V 682 H 64" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 796 513 H 882" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="811" y="500" font-size="14" font-weight="400" fill="#46566d">HTTPS</text><text x="40" y="810" font-size="18" font-weight="400" fill="#142033">普通阅读、搜索、笔记与阅读指引在本地完成；AI 分析由配置的接收端处理。</text><text x="40" y="840" font-size="16" font-weight="400" fill="#46566d">箭头表示调用或数据依赖，不表示被分析项目的执行顺序。</text></g>
</svg>
