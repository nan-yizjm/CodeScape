<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="890" viewBox="0 0 1120 890" role="img" aria-labelledby="title description">
<title id="title">从源码到可探索架构</title>
<desc id="description">静态事实、AI 归纳和发布校验逐步衔接，所有解释回到版本快照核对。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#64748b"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<rect width="1120" height="890" rx="24" fill="#f8fafc"/>
<text x="40" y="53" font-size="30" font-weight="700" fill="#142033">从源码到可探索架构</text><text x="40" y="87" font-size="17" font-weight="400" fill="#46566d">静态事实、AI 归纳和发布校验逐步衔接，所有解释回到版本快照核对。</text><rect x="64" y="145" width="460" height="145" rx="18" fill="#eef3ff" stroke="#cbd5e1"/><text x="88" y="183" font-size="23" font-weight="650" fill="#142033">01  预览导入范围</text><text x="88" y="215" font-size="18" font-weight="400" fill="#46566d">选择目录或公开 Git 来源</text><text x="88" y="242" font-size="18" font-weight="400" fill="#46566d">确认包含、排除与语言范围</text><rect x="596" y="145" width="460" height="145" rx="18" fill="#edf8f4" stroke="#cbd5e1"/><text x="620" y="183" font-size="23" font-weight="650" fill="#142033">02  固定只读快照</text><text x="620" y="215" font-size="18" font-weight="400" fill="#46566d">文件哈希 / 规则 / 来源 Commit</text><text x="620" y="242" font-size="18" font-weight="400" fill="#46566d">后续阅读绑定该版本</text><rect x="596" y="350" width="460" height="145" rx="18" fill="#edf8f4" stroke="#cbd5e1"/><text x="620" y="388" font-size="23" font-weight="650" fill="#142033">03  建立静态索引</text><text x="620" y="420" font-size="18" font-weight="400" fill="#46566d">实体、真实作用域、调用与位置</text><text x="620" y="447" font-size="18" font-weight="400" fill="#46566d">保留诊断和未确认范围</text><rect x="64" y="350" width="460" height="145" rx="18" fill="#f3efff" stroke="#cbd5e1"/><text x="88" y="388" font-size="23" font-weight="650" fill="#142033">04  授权后的分批分析</text><text x="88" y="420" font-size="18" font-weight="400" fill="#46566d">在预算内归纳职责与函数讲解</text><text x="88" y="447" font-size="18" font-weight="400" fill="#46566d">有限补读快照 / 保存批次检查点</text><rect x="64" y="555" width="460" height="145" rx="18" fill="#fff5e8" stroke="#cbd5e1"/><text x="88" y="593" font-size="23" font-weight="650" fill="#142033">05  校验与全局归并</text><text x="88" y="625" font-size="18" font-weight="400" fill="#46566d">结构、引用、归属及调用证据</text><text x="88" y="652" font-size="18" font-weight="400" fill="#46566d">整理模块层级与简明项目概览</text><rect x="596" y="555" width="460" height="145" rx="18" fill="#eef3ff" stroke="#cbd5e1"/><text x="620" y="593" font-size="23" font-weight="650" fill="#142033">06  事务发布候选</text><text x="620" y="625" font-size="18" font-weight="400" fill="#46566d">成功后切换当前版本并迁移学习</text><text x="620" y="652" font-size="18" font-weight="400" fill="#46566d">保留旧结果、历史和待复核项</text><path d="M 524 217 H 596" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 826 290 V 350" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 596 422 H 524" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 294 495 V 555" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 524 627 H 596" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="750" width="992" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="88" y="792" font-size="20" font-weight="600" fill="#142033">请求或校验失败 → 保留检查点并暂停 / 修复，不发布未通过的结果。</text><text x="40" y="858" font-size="17" font-weight="400" fill="#46566d">本图描述 CodeScape 的分析方法，不是被分析程序的运行流程图。</text></g>
</svg>
