<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880" role="img" aria-labelledby="title description">
<title id="title">版本更新与人工修正</title>
<desc id="description">人工编辑保留原始结果；新分析成功后才发布，可靠关联延续，不确定部分交给复核。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#64748b"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<rect width="1120" height="880" rx="24" fill="#f8fafc"/>
<text x="40" y="53" font-size="30" font-weight="700" fill="#142033">版本更新与人工修正</text><text x="40" y="87" font-size="17" font-weight="400" fill="#46566d">人工编辑保留原始结果；新分析成功后才发布，可靠关联延续，不确定部分交给复核。</text><text x="64" y="139" font-size="16" font-weight="650" fill="#46566d">当前已发布版本</text><text x="596" y="139" font-size="16" font-weight="650" fill="#46566d">重新分析与新版本</text><rect x="64" y="165" width="460" height="140" rx="18" fill="#eef3ff" stroke="#cbd5e1"/><text x="88" y="203" font-size="23" font-weight="650" fill="#142033">原始 AI 结果 + 源码快照</text><text x="88" y="235" font-size="18" font-weight="400" fill="#46566d">不可被人工编辑覆盖</text><text x="88" y="262" font-size="18" font-weight="400" fill="#46566d">旧版本始终读取自己的快照</text><rect x="64" y="360" width="460" height="140" rx="18" fill="#f3efff" stroke="#cbd5e1"/><text x="88" y="398" font-size="23" font-weight="650" fill="#142033">独立人工修改层</text><text x="88" y="430" font-size="18" font-weight="400" fill="#46566d">改名 / 说明 / 拆分 / 合并 / 归属</text><text x="88" y="457" font-size="18" font-weight="400" fill="#46566d">预览保存 / 撤销重做 / 恢复原始</text><rect x="64" y="555" width="460" height="145" rx="18" fill="#edf8f4" stroke="#cbd5e1"/><text x="88" y="593" font-size="23" font-weight="650" fill="#142033">有效架构与学习工作区</text><text x="88" y="625" font-size="18" font-weight="400" fill="#46566d">原始结果叠加人工修改</text><text x="88" y="652" font-size="18" font-weight="400" fill="#46566d">依赖按源码证据重新聚合</text><rect x="596" y="165" width="460" height="140" rx="18" fill="#fff5e8" stroke="#cbd5e1"/><text x="620" y="203" font-size="23" font-weight="650" fill="#142033">独立候选 · 手动重扫</text><text x="620" y="235" font-size="18" font-weight="400" fill="#46566d">新快照与分批检查点</text><text x="620" y="262" font-size="18" font-weight="400" fill="#46566d">失败或取消，继续阅读旧版本</text><rect x="596" y="360" width="460" height="140" rx="18" fill="#edf8f4" stroke="#cbd5e1"/><text x="620" y="398" font-size="23" font-weight="650" fill="#142033">校验通过 · 事务发布</text><text x="620" y="430" font-size="18" font-weight="400" fill="#46566d">可靠身份迁移学习、笔记和修改</text><text x="620" y="457" font-size="18" font-weight="400" fill="#46566d">实现变化及匹配冲突明确提示</text><rect x="596" y="555" width="460" height="145" rx="18" fill="#eef3ff" stroke="#cbd5e1"/><text x="620" y="593" font-size="23" font-weight="650" fill="#142033">当前新版 + 可读历史</text><text x="620" y="625" font-size="18" font-weight="400" fill="#46566d">最近 5 个成功版本，固定版额外保留</text><text x="620" y="652" font-size="18" font-weight="400" fill="#46566d">阅读中及待复核来源受保护</text><path d="M 524 235 H 596" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="537" y="222" font-size="15" font-weight="400" fill="#46566d">重扫</text><path d="M 294 305 V 360" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="310" y="341" font-size="15" font-weight="400" fill="#46566d">人工调整</text><path d="M 294 500 V 555" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 64 235 H 42 V 625 H 64" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 826 305 V 360" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 826 500 V 555" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 524 625 H 596" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="530" y="613" font-size="15" font-weight="400" fill="#46566d">迁移</text><rect x="64" y="755" width="992" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="88" y="790" font-size="20" font-weight="600" fill="#142033">无法可靠匹配时保留正文、原版本与待复核项，不强行对应同名实体。</text><text x="88" y="820" font-size="18" font-weight="400" fill="#46566d">学习状态按实现指纹严格迁移；笔记关联与学习状态分别处理。</text></g>
</svg>
